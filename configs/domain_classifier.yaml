# Controlled domain-classifier audit defaults.
# Manifests are produced by data/domain_classifier at
# manifests/<comparison>/{train,val,test}.jsonl and must contain participant
# and pair provenance.
comparison: fomo45k
output_dir: outputs/diagnostics/domain_classifier
manifests:
  train: outputs/diagnostics/domain_classifier/manifests/fomo45k/train.jsonl
  val: outputs/diagnostics/domain_classifier/manifests/fomo45k/val.jsonl
  test: outputs/diagnostics/domain_classifier/manifests/fomo45k/test.jsonl
training:
  model: small_cnn
  in_channels: 3
  num_classes: 1
  widths: [32, 64, 128, 128]
  groupnorm_groups: 8
  dropout: 0.0
  learning_rate: null
  weight_decay: 0.0001
  max_epochs: 40
  patience: 8
  batch_size: 32
  num_workers: 0
  threshold: 0.5
  split_seed: 73
  stage: final
  device: auto
  subject_method: mean
  no_augmentation: true
  bootstrap_replicates: 2000
  swap_replicates: 1000
  permutation_replicates: 19
  permutation_mode: smoke
