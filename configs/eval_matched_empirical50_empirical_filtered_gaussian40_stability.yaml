# Diagnostic-only evaluation. Run only if the primary Gaussian50 result is not PASS.
experiment:
  name: empirical_filtered_gaussian40_stability_matched_empirical50

runtime:
  seed: 73
  device: auto
  cudnn_benchmark: false
  deterministic: true
  accelerate: false

data:
  type: volume
  dataset_path: C:/ML/data/BraTS_2021
  path_to_csv: C:/ML/andi_test/Test/andi_rewrite/splits/BraTS21/scans_test_50.csv
  image_size: 128
  channels: 4
  batch_size: 1
  workers: 0
  shuffle: false
  size_splits: 155
  modalities: [flair, t1, t1ce, t2]
  histogram_normalization: false
  shift_naming: false

model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256
  checkpoint: outputs/checkpoints/empirical_filtered_gaussian40_lmdb_stability_run01/epoch_0039.pt
  use_ema: true

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: empirical_spectrum
      generation_method: filtered_gaussian
      stats_path: C:/ML/andi_test/Test/andi_rewrite/outputs/spectrum/brats21_healthy_lmdb_empirical_spectrum_stability.npz
      mode: radial
      radial_power_key: radial_power
      spectrum_power_key: mean_power
      strength: 1.0
      normalize: true
      per_channel: true
      eps: 1.0e-8

anomaly:
  t_lower: 75
  t_upper: 200
  aggregation: {type: geometric_mean, eps: 1.0e-8}
  modality_pool: {type: max}
  median_filter: {enabled: true, kernel_size: 5}
  threshold: yen

metrics:
  output_csv: outputs/metrics/empirical_filtered_gaussian40_lmdb_stability_run01_matched50/ANDi.csv
  output_mf_csv: outputs/metrics/empirical_filtered_gaussian40_lmdb_stability_run01_matched50/ANDi_mf.csv
  compute_auprc: true
  auprc_seed: 73
  thr_start: 0.01
  thr_end: 0.3
  thr_step: 0.001
  threshold: 0.5
  size_splits: 155
  rank: 3
  connectivity: 1
  median_filter: {enabled: true, kernel_size: 5, mode: 3d}
  postprocess:
    score:
      pipeline: [{type: normalize}]
    score_mf:
      pipeline:
        - {type: median_filter, kernel_size: 5, mode: 3d}
        - {type: normalize}
    threshold_mask:
      pipeline: [{type: binary_dilation, rank: 3, connectivity: 1, iterations: 1}]
    yen_mask:
      pipeline: [{type: binary_dilation, rank: 3, connectivity: 1, iterations: 1}]

evaluation:
  progress: {enabled: true}
