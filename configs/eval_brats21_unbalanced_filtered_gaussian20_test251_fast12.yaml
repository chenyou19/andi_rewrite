experiment:
  name: brats21_unbalanced_filtered_gaussian20_test251_fast12
runtime:
  seed: 73
  device: cuda
  accelerate: false
  find_unused_parameters: true
data:
  type: volume
  dataset_path: D:/project/data/BraTS21
  path_to_csv: ./splits/BraTS21/scans_test.csv
  image_size: 128
  channels: 4
  batch_size: 1
  workers: 0
  size_splits: 155
  modalities:
  - flair
  - t1
  - t1ce
  - t2
  histogram_normalization: false
  shift_naming: false
  return_metadata: true
  normalize_input: true
model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256
  checkpoint: outputs/checkpoints/brats21_unbalanced_filtered_gaussian20/epoch_0019.pt
  use_ema: true
diffusion:
  steps: 1000
  beta_start: 0.0001
  beta_end: 0.02
noise:
  schedule:
    type: static
    sampler:
      type: empirical_spectrum
      generation_method: filtered_gaussian
      stats_path: outputs/spectrum/brats21_healthy_unbalanced_empirical_spectrum.npz
      mode: radial
      radial_power_key: radial_power
      spectrum_power_key: mean_power
      strength: 1.0
      normalize: true
      per_channel: true
      eps: 1.0e-08
anomaly:
  t_lower: 75
  t_upper: 200
  aggregation:
    type: geometric_mean
    eps: 1.0e-08
  modality_pool:
    type: max
  median_filter:
    enabled: true
    kernel_size: 5
  threshold: yen
metrics:
  postprocess_mode: rewrite
  threshold_method: yen
  output_csv: outputs\evaluation\brats21_unbalanced_filtered_gaussian20_test251_20261112\ANDi.csv
  output_mf_csv: outputs\evaluation\brats21_unbalanced_filtered_gaussian20_test251_20261112\ANDi_mf.csv
  thr_start: 0.01
  thr_end: 0.3
  thr_step: 0.001
  threshold: 0.5
  size_splits: 155
  kernel_size: 5
  rank: 3
  connectivity: 1
  median_filter:
    enabled: true
    kernel_size: 5
    mode: 3d
  original_andi:
    normalization_scope: dataset
    median_filter:
      enabled: true
      kernel_size: 5
      mode: 3d
    binary_mask:
      binary_dilation:
        enabled: true
        rank: 3
        connectivity: 1
        iterations: 1
  postprocess:
    score:
      pipeline:
      - type: normalize
    score_mf:
      pipeline:
      - type: median_filter
        kernel_size: 5
        mode: 3d
      - type: normalize
    threshold_mask:
      pipeline: []
    binary_mask:
      pipeline:
      - type: binary_dilation
        rank: 3
        connectivity: 1
        iterations: 1
  normalization_scope: dataset
prediction_output:
  enabled: true
  directory: outputs\evaluation\brats21_unbalanced_filtered_gaussian20_test251_20261112\predictions
  normalization_scope: dataset
  restore_native_grid: true
  save_raw_score: true
  save_median_filtered_score: true
  binary_mask_source: score_mf
  save_binary_mask: true
  save_model_grid: false
  async_write:
    enabled: true
    workers: 4
    max_pending_jobs: 8
    max_pending_bytes: 268435456
evaluation:
  progress:
    enabled: true
  inference_profile: fast12
  memory_mode: disk_streaming
  threshold_sweep_backend: auto
  cache:
    directory: outputs\evaluation\brats21_unbalanced_filtered_gaussian20_test251_20261112\cache
    resume: true
    keep_on_success: true
  compute_auprc: true
  auprc_mode: sampled
  auprc_max_samples: 5000000
  auprc_seed: 73
