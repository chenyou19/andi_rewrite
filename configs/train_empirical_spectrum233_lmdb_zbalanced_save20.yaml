# Train 233 epochs with empirical-spectrum noise on z-balanced BraTS healthy-slice LMDB.
experiment:
  name: empirical_spectrum233_lmdb_zbalanced_save20

runtime:
  seed: 73
  device: auto
  cudnn_benchmark: true
  accelerate: false
  find_unused_parameters: true

data:
  type: lmdb
  path: C:/ML/data/BraTS_2021_healthy_lmdb_zbalanced
  image_size: 128
  channels: 4
  batch_size: 52
  workers: 0
  shuffle: true

model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: empirical_spectrum
      stats_path: C:/ML/andi_test/Test/andi_rewrite/outputs/spectrum/brats21_healthy_zbalanced_empirical_spectrum.npz
      mode: radial
      spectrum_key: mean_amplitude
      radial_key: radial_amplitude
      strength: 1.0
      normalize: true
      per_channel: true
      eps: 1.0e-8

training:
  run_name: empirical_spectrum233_lmdb_zbalanced_save20
  epochs: 233
  start_lr: 2.0e-5
  target_lr: 1.0e-4
  scheduler:
    type: warmup_cosine
    warmup_steps: 0.05
    start_lr: 2.0e-5
    target_lr: 1.0e-4
  ema:
    enabled: true
    decay: 0.995
    step_start: 2000
  normalize_input: true
  progress:
    enabled: true
  eval_after_fit:
    enabled: false
  checkpoint:
    dir: outputs/checkpoints
    start_epoch: 19
    save_every_epochs: 20
    save_last: true
    resume:
  samples:
    enabled: true
    output_dir: outputs/samples
    start_epoch: 19
    every_epochs: 20
    num_images: 3
    channels: 4
    image_size: 128
    mode: L
    nrow:
    use_ema: true
    dtype: float32
    clip_denoised: true
