# 預設 full-volume ANDi evaluation config。
experiment:
  name: andi_rewrite_eval_default

# 使用 accelerate 啟動 distributed eval 時，將 accelerate 設成 true。
runtime:
  seed: 73
  device: auto
  accelerate: false
  find_unused_parameters: true

# volume data 預期每個 subject 一個資料夾，且 modality 檔名為：
# <subject>_flair.nii.gz、<subject>_t1.nii.gz、<subject>_t1ce.nii.gz、
# <subject>_t2.nii.gz，以及 <subject>_seg.nii.gz。
data:
  type: volume
  dataset_path: ./data/BraTS21
  path_to_csv: ./splits/BraTS21/scans_test.csv
  image_size: 128
  channels: 4
  batch_size: 1
  workers: 4
  size_splits: 155
  modalities: [flair, t1, t1ce, t2]
  histogram_normalization: false
  shift_naming: false

# checkpoint 可指向 train.py 產出的 framework checkpoint。
# use_ema=true 時，若 checkpoint 內有 ema_model 會優先載入。
model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256
  checkpoint:
  use_ema: true

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: gaussian

# ANDi detector 控制 transition deviation 計算與 anomaly map 聚合方式。
anomaly:
  t_lower: 75
  t_upper: 200
  aggregation:
    type: geometric_mean
    eps: 1.0e-8
  modality_pool:
    type: max
  median_filter:
    enabled: true
    kernel_size: 5
  threshold: yen

# metrics 控制 CSV 輸出、threshold sweep 與後處理 pipelines。
metrics:
  # rewrite 保留目前可組合 pipeline；original_andi 精確重現原版 eval.py。
  # 舊 config 未指定此欄位時仍走 legacy-compatible rewrite，並顯示遷移警告。
  postprocess_mode: rewrite
  # yen 為向後相容預設；也可設為 otsu，兩者都對每個完整 3D volume 執行。
  threshold_method: yen
  output_csv: outputs/metrics/ANDi.csv
  output_mf_csv: outputs/metrics/ANDi_mf.csv
  thr_start: 0.01
  thr_end: 0.3
  thr_step: 0.001
  threshold: 0.5
  size_splits: 155
  kernel_size: 5
  rank: 3
  connectivity: 1
  median_filter:
    enabled: true
    kernel_size: 5
    mode: 3d
  # 原版模式固定先對 raw map 做 3D median filter，再讓 raw/MF 兩分支
  # 各自使用完整測試集的 Min-Max；自適應 threshold 則逐 subject 計算。
  original_andi:
    normalization_scope: dataset
    median_filter:
      enabled: true
      kernel_size: 5
      mode: 3d
    binary_mask:
      binary_dilation:
        enabled: true
        rank: 3
        connectivity: 1
        iterations: 1
  # postprocess 是有順序且可擴充的 pipeline。
  # 若要新增 step，先以 anomaly/postprocess/base.py 的 decorator 在 transforms.py 註冊，再於此以 type 引用。
  postprocess:
    score:
      pipeline:
        - type: normalize
    score_mf:
      pipeline:
        - type: median_filter
          kernel_size: 5
          mode: 3d
        - type: normalize
    threshold_mask:
      pipeline: []
    binary_mask:
      pipeline:
        - type: binary_dilation
          rank: 3
          connectivity: 1
          iterations: 1

# mode-specific scope 讓 rewrite 保留舊版 per-subject export，切換成
# original_andi 時自動使用 dataset scope，與 metrics 共用同一 processed tensor。
prediction_output:
  enabled: false
  directory: outputs/predictions
  normalization_scope:
    rewrite: subject
    original_andi: dataset
  restore_native_grid: true
  save_raw_score: true
  save_median_filtered_score: true
  binary_mask_source: score_mf
  save_binary_mask: true

evaluation:
  progress:
    enabled: true
