experiment:
  name: pyramid20_lmdb_5fold_fold_2
runtime:
  seed: 73
  device: auto
  cudnn_benchmark: true
  accelerate: false
  find_unused_parameters: true
data:
  type: lmdb
  path: C:\ML\data\BraTS_2021_healthy_lmdb_5fold\fold_2
  image_size: 128
  channels: 4
  batch_size: 52
  workers: 0
  shuffle: true
model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256
diffusion:
  steps: 1000
  beta_start: 0.0001
  beta_end: 0.02
noise:
  schedule:
    type: static
    sampler:
      type: pyramid
      discount: 0.8
      levels: 10
      normalize: true
training:
  run_name: pyramid20_lmdb_5fold_fold_2
  epochs: 20
  start_lr: 2.0e-05
  target_lr: 0.0001
  scheduler:
    type: warmup_cosine
    warmup_steps: 0.05
    start_lr: 2.0e-05
    target_lr: 0.0001
  ema:
    enabled: true
    decay: 0.995
    step_start: 2000
  normalize_input: true
  progress:
    enabled: true
  eval_after_fit:
    enabled: true
    config: configs\5fold\eval_fold_2.yaml
  checkpoint:
    dir: outputs/checkpoints/5fold
    start_epoch: 19
    save_every_epochs: 1
    resume: null
  samples:
    enabled: true
    output_dir: outputs/samples/5fold
    start_epoch: 19
    every_epochs: 1
    num_images: 3
    channels: 4
    image_size: 128
    mode: L
    nrow: null
    use_ema: true
    dtype: float32
    clip_denoised: true
