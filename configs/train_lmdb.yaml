# ANDi training config that reads preprocessed healthy slices from LMDB.
experiment:
  name: andi_rewrite_train_lmdb

runtime:
  seed: 73
  device: auto
  cudnn_benchmark: true
  accelerate: false
  find_unused_parameters: true

data:
  type: lmdb
  path: C:/ML/data/BraTS_2021_healthy_lmdb
  image_size: 128
  channels: 4
  batch_size: 52
  workers: 0
  shuffle: true

model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: pyramid
      discount: 0.8
      levels: 10
      normalize: true

training:
  run_name: andi_rewrite_train_lmdb
  epochs: 20
  start_lr: 2.0e-5
  target_lr: 1.0e-4
  scheduler:
    type: warmup_cosine
    warmup_steps: 0.05
    start_lr: 2.0e-5
    target_lr: 1.0e-4
  ema:
    enabled: true
    decay: 0.995
    step_start: 2000
  normalize_input: true
  progress:
    enabled: true
  checkpoint:
    dir: outputs/checkpoints
    start_epoch: 120
    save_every_epochs: 4
    resume:
  samples:
    enabled: true
    output_dir: outputs/samples
    start_epoch: 120
    every_epochs: 4
    num_images: 3
    channels: 4
    image_size: 128
    mode: L
    nrow:
    use_ema: true
    dtype: float32
    clip_denoised: true
