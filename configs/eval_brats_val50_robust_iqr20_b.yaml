experiment:
  name: brats_val50_robust_iqr20_b
runtime:
  seed: 73
  device: auto
  cudnn_benchmark: true
  deterministic: false
  accelerate: false
data:
  type: volume
  dataset_path: C:/ML/data/BraTS_2021
  path_to_csv: outputs/datasets/fomo45k_sri24_robust_iqr/brats_validation50.csv
  image_size: 128
  channels: 3
  batch_size: 1
  workers: 0
  size_splits: 155
  modalities: [flair, t1, t2]
  segmentation_suffix: seg
  filename_separator: "_"
  histogram_normalization: false
  intensity_normalization: robust_iqr
  normalize_input: false
  shift_naming: false
  return_metadata: true
model:
  type: andi_unet
  image_size: 128
  in_channels: 3
  out_channels: 3
  time_dim: 256
  checkpoint: outputs/runs/fomo45k_robust_iqr20_b/epoch_0019.pt
  use_ema: true
diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
noise:
  schedule:
    type: static
    sampler:
      type: empirical_spectrum
      stats_path: C:/ML/data/FOMO45K_SRI24_BraTS21_ANDi/PT007_NIMH/spectrum/fomo45k_sri24_flair_t1_t2_empirical_spectrum.npz
      generation_method: filtered_gaussian
      mode: radial
      spectrum_key: mean_amplitude
      radial_key: radial_amplitude
      spectrum_power_key: mean_power
      radial_power_key: radial_power
      strength: 1.0
      normalize: true
      per_channel: true
      eps: 1.0e-8
anomaly:
  t_lower: 75
  t_upper: 200
  aggregation:
    type: geometric_mean
    eps: 1.0e-8
  modality_pool:
    type: max
  median_filter:
    enabled: true
    kernel_size: 5
  threshold: yen
metrics:
  postprocess_mode: rewrite
  threshold_method: yen
  normalization_scope: dataset
  output_csv: outputs/runs/fomo45k_robust_iqr20_b/evaluation/brats_val50/ANDi.csv
  output_mf_csv: outputs/runs/fomo45k_robust_iqr20_b/evaluation/brats_val50/ANDi_mf.csv
  thr_start: 0.01
  thr_end: 0.3
  thr_step: 0.001
  threshold: 0.5
  size_splits: 155
  kernel_size: 5
  rank: 3
  connectivity: 1
  median_filter:
    enabled: true
    kernel_size: 5
    mode: 3d
  postprocess:
    score:
      pipeline: [{type: normalize}]
    score_mf:
      pipeline:
        - {type: median_filter, kernel_size: 5, mode: 3d}
        - {type: normalize}
    threshold_mask:
      pipeline: [{type: binary_dilation, rank: 3, connectivity: 1, iterations: 1}]
    yen_mask:
      pipeline: []
prediction_output:
  enabled: false
evaluation:
  memory_mode: disk_streaming
  cache:
    directory: outputs/runs/fomo45k_robust_iqr20_b/evaluation/brats_val50/cache
    resume: true
    keep_on_success: true
  compute_auprc: true
  auprc_mode: sampled
  auprc_max_samples: 5000000
  auprc_seed: 73
  progress:
    enabled: true
