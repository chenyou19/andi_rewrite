# Matched-noise evaluation: LEMON-data/BraTS21-spectrum model uses its own
# BraTS21 [0,1,3]=[FLAIR,T1,T2] spectrum on the same 251 BraTS21 subjects.
experiment:
  name: brats21_251_lemon_brats21_noise_model

runtime:
  seed: 73
  device: auto
  cudnn_benchmark: true
  accelerate: false
  find_unused_parameters: true

data:
  type: volume
  dataset_path: C:/ML/data/BraTS_2021
  path_to_csv: C:/ML/data/BraTS_2021_healthy_lmdb/scans_test.csv
  image_size: 128
  channels: 3
  batch_size: 1
  workers: 0
  size_splits: 155
  modalities: [flair, t1, t2]
  segmentation_suffix: seg
  filename_separator: "_"
  histogram_normalization: false
  shift_naming: false

model:
  type: andi_unet
  image_size: 128
  in_channels: 3
  out_channels: 3
  time_dim: 256
  checkpoint: C:/ML/andi_test/Test/andi_rewrite/outputs/runs/lemon_t1_t2_flair_brats21_empirical_spectrum233/epoch_0232.pt
  use_ema: true

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: empirical_spectrum
      stats_path: C:/ML/data/spectrum/brats21_healthy_empirical_spectrum.npz
      channel_indices: [0, 1, 3]
      generation_method: filtered_gaussian
      mode: radial
      spectrum_key: mean_amplitude
      radial_key: radial_amplitude
      spectrum_power_key: mean_power
      radial_power_key: radial_power
      strength: 1.0
      normalize: true
      per_channel: true
      eps: 1.0e-8

anomaly:
  t_lower: 75
  t_upper: 200
  aggregation:
    type: geometric_mean
    eps: 1.0e-8
  modality_pool:
    type: max
  median_filter:
    enabled: true
    kernel_size: 5
  threshold: yen

metrics:
  output_csv: outputs/comparisons/brats21_251_lemon_models_matched_noise/lemon_brats21_noise/ANDi.csv
  output_mf_csv: outputs/comparisons/brats21_251_lemon_models_matched_noise/lemon_brats21_noise/ANDi_mf.csv
  compute_auprc: true
  auprc_max_samples: 5000000
  auprc_seed: 73
  thr_start: 0.01
  thr_end: 0.3
  thr_step: 0.001
  threshold: 0.5
  size_splits: 155
  kernel_size: 5
  rank: 3
  connectivity: 1
  postprocess_mode: rewrite
  median_filter:
    enabled: true
    kernel_size: 5
    mode: 3d
  postprocess:
    score:
      pipeline:
        - type: normalize
    score_mf:
      pipeline:
        - type: median_filter
          kernel_size: 5
          mode: 3d
        - type: normalize
    threshold_mask:
      pipeline:
        - type: binary_dilation
          rank: 3
          connectivity: 1
          iterations: 1
    yen_mask:
      pipeline: []

evaluation:
  progress:
    enabled: true
