# Evaluate 50 BraTS21 volumes using the pyramid-trained epoch 0232 checkpoint
# with fixed-magnitude empirical-spectrum inference noise.
experiment:
  name: brats21_50_pyramid233_epoch0232_empirical_spectrum

runtime:
  seed: 73
  device: auto
  cudnn_benchmark: true
  accelerate: false
  find_unused_parameters: true

data:
  type: volume
  dataset_path: C:/ML/data/BraTS_2021
  path_to_csv: C:/ML/andi_test/Test/andi_rewrite/splits/BraTS21/scans_test_50.csv
  image_size: 128
  channels: 4
  batch_size: 1
  workers: 0
  size_splits: 155
  modalities: [flair, t1, t1ce, t2]
  histogram_normalization: false
  shift_naming: false

model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256
  checkpoint: C:/ML/andi_test/Test/andi_rewrite/outputs/checkpoints/pyramid233_lmdb_full_gaussian/epoch_0232.pt
  use_ema: true

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: empirical_spectrum
      stats_path: C:/ML/andi_test/Test/andi_rewrite/outputs/spectrum/brats21_healthy_empirical_spectrum.npz
      generation_method: fixed_magnitude
      mode: radial
      spectrum_key: mean_amplitude
      radial_key: radial_amplitude
      strength: 1.0
      normalize: true
      per_channel: true
      eps: 1.0e-8

anomaly:
  t_lower: 75
  t_upper: 200
  aggregation:
    type: geometric_mean
    eps: 1.0e-8
  modality_pool:
    type: max
  median_filter:
    enabled: true
    kernel_size: 5
  threshold: yen

metrics:
  output_csv: outputs/metrics/brats21_50_pyramid233_epoch0232_empirical_spectrum/ANDi.csv
  output_mf_csv: outputs/metrics/brats21_50_pyramid233_epoch0232_empirical_spectrum/ANDi_mf.csv
  compute_auprc: true
  auprc_max_samples: 5000000
  auprc_seed: 73
  thr_start: 0.01
  thr_end: 0.3
  thr_step: 0.001
  threshold: 0.5
  size_splits: 155
  kernel_size: 5
  rank: 3
  connectivity: 1
  median_filter:
    enabled: true
    kernel_size: 5
    mode: 3d
  postprocess:
    score:
      pipeline:
        - type: normalize
    score_mf:
      pipeline:
        - type: median_filter
          kernel_size: 5
          mode: 3d
        - type: normalize
    threshold_mask:
      pipeline:
        - type: binary_dilation
          rank: 3
          connectivity: 1
          iterations: 1
    yen_mask:
      pipeline:
        - type: binary_dilation
          rank: 3
          connectivity: 1
          iterations: 1

evaluation:
  progress:
    enabled: true
