# Base config for evaluating every checkpoint in
# empirical_spectrum233_lmdb_full_gaussian_20260609 on the 251-subject
# BraTS23 test split with fixed-magnitude empirical-spectrum noise.
# scripts/eval_checkpoints50.py overrides model.checkpoint and metric outputs
# for each epoch_*.pt file.
experiment:
  name: brats23_251_all_checkpoints_fixed_magnitude

runtime:
  seed: 73
  device: auto
  cudnn_benchmark: true
  accelerate: false
  find_unused_parameters: true

data:
  type: volume
  dataset_path: C:/ML/data/BraTS23
  path_to_csv: C:/ML/ANDi/splits/BraTS23/scans_test.csv
  image_size: 128
  channels: 4
  batch_size: 1
  workers: 0
  size_splits: 155
  modalities: [t2f, t1n, t1c, t2w]
  segmentation_suffix: seg
  filename_separator: "-"
  histogram_normalization: false
  shift_naming: false

model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256
  # Placeholder used only when loading this config directly; batch evaluation
  # replaces it with each matching checkpoint.
  checkpoint: C:/ML/andi_test/Test/andi_rewrite/outputs/checkpoints/empirical_spectrum233_lmdb_full_gaussian_20260609/epoch_0019.pt
  use_ema: true

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: empirical_spectrum
      stats_path: C:/ML/andi_test/Test/andi_rewrite/outputs/spectrum/brats21_healthy_empirical_spectrum.npz
      generation_method: fixed_magnitude
      mode: radial
      spectrum_key: mean_amplitude
      radial_key: radial_amplitude
      strength: 1.0
      normalize: true
      per_channel: true
      eps: 1.0e-8

anomaly:
  t_lower: 75
  t_upper: 200
  aggregation:
    type: geometric_mean
    eps: 1.0e-8
  modality_pool:
    type: max
  median_filter:
    enabled: true
    kernel_size: 5
  threshold: yen

metrics:
  # These placeholders are replaced with per-checkpoint paths by the batch script.
  output_csv: outputs/metrics/brats23_251_all_checkpoints_fixed_magnitude/placeholder/ANDi.csv
  output_mf_csv: outputs/metrics/brats23_251_all_checkpoints_fixed_magnitude/placeholder/ANDi_mf.csv
  compute_auprc: true
  auprc_max_samples: 5000000
  auprc_seed: 73
  thr_start: 0.01
  thr_end: 0.3
  thr_step: 0.001
  threshold: 0.5
  size_splits: 155
  kernel_size: 5
  rank: 3
  connectivity: 1
  median_filter:
    enabled: true
    kernel_size: 5
    mode: 3d
  postprocess:
    score:
      pipeline:
        - type: normalize
    score_mf:
      pipeline:
        - type: median_filter
          kernel_size: 5
          mode: 3d
        - type: normalize
    threshold_mask:
      pipeline:
        - type: binary_dilation
          rank: 3
          connectivity: 1
          iterations: 1
    yen_mask:
      pipeline:
        - type: binary_dilation
          rank: 3
          connectivity: 1
          iterations: 1

evaluation:
  progress:
    enabled: true
