registration:
  mi_bins: 32
  sampling_proportion:
  factors: [4, 2, 1]
  sigmas: [3, 1, 0]
  iterations: [1000, 100, 10]
  flair_to_t1: [center_of_mass, translation, rigid_6dof]
  t2_to_t1: [center_of_mass, translation, rigid_6dof]
  t1_to_mni: [center_of_mass, translation, rigid_6dof, affine_12dof]
  dipy_affine_map_convention: static-world-to-moving-world pull matrix
  persisted_world_convention: moving-world-to-static-world forward matrix
  image_interpolation: linear
  mask_interpolation: nearest
  final_resample_policy: compose-forward-then-invert; no modality T1-grid intermediate output

mask:
  guard_dilation_mm: 5.0
  final: warped native HD-BET T1 mask AND dilated MNI guard

roi:
  margin_mm: 8.0
  output_size: 128
  fixed_across_subjects: true
  physical_square: true

lmdb:
  map_size_bytes: 17179869184
  key_format: 8-digit zero-padded contiguous decimal
  value: pickle NumPy float32 [3,128,128]
  order: source CSV order then z ascending
  channel_order: [FLAIR, T1, T2]

qc:
  dice_fail_below: 0.70
  singular_value_range: [0.25, 4.0]
  guard_retention_review_below: 0.98
  modified_z_threshold: 3.5
  suspicious_count: 15
  automatic_exclusion: false

disk:
  minimum_before_full_gib: 20.0
  hdbet_install_before_gib: 225.78341293333398
