# Train the histogram-matched, BraTS-z-balanced FOMO45K SRI24
# [FLAIR,T1,T2] LMDB for 20 epochs with training-matched empirical noise.
experiment:
  name: fomo45k_sri24_brats_histmatch_zbucket29_69k_empirical_spectrum20

runtime:
  seed: 73
  device: auto
  cudnn_benchmark: true
  deterministic: false
  accelerate: false
  find_unused_parameters: true

data:
  type: lmdb
  path: outputs/datasets/fomo45k_sri24_brats_histmatch_zbucket29_69k/train
  image_size: 128
  channels: 3
  batch_size: 52
  workers: 0
  pin_memory: true
  shuffle: true

validation:
  enabled: true
  every_epochs: 1
  seed: 73
  use_ema: true
  data:
    type: lmdb
    path: outputs/datasets/fomo45k_sri24_brats_histmatch_zbucket29_69k/val
    image_size: 128
    channels: 3
    batch_size: 52
    workers: 0
    pin_memory: true
    shuffle: false

model:
  type: andi_unet
  image_size: 128
  in_channels: 3
  out_channels: 3
  time_dim: 256

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: empirical_spectrum
      stats_path: C:/ML/data/FOMO45K_SRI24_BraTS21_ANDi/PT007_NIMH/spectrum/fomo45k_sri24_flair_t1_t2_empirical_spectrum.npz
      mode: radial
      spectrum_key: mean_amplitude
      radial_key: radial_amplitude
      spectrum_power_key: mean_power
      radial_power_key: radial_power
      generation_method: filtered_gaussian
      strength: 1.0
      normalize: true
      per_channel: true
      eps: 1.0e-8

training:
  run_name: fomo45k_sri24_brats_histmatch_zbucket29_69k_empirical_spectrum20
  epochs: 20
  start_lr: 2.0e-5
  target_lr: 1.0e-4
  scheduler:
    type: warmup_cosine
    warmup_steps: 0.05
    start_lr: 2.0e-5
    target_lr: 1.0e-4
  ema:
    enabled: true
    decay: 0.995
    step_start: 2000
  normalize_input: true
  finite_checks: true
  progress:
    enabled: true
  checkpoint:
    dir: outputs/runs
    start_epoch: 4
    save_every_epochs: 5
    save_last: true
    resume:
  samples:
    enabled: false
  eval_after_fit:
    enabled: true
    config: configs/eval_brats21_test50_fomo45k_sri24_brats_histmatch_zbucket29_69k_empirical_spectrum20.yaml
