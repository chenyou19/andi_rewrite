# One-case UCSF-PDGM integration inference using the existing 233-epoch
# pyramid-trained checkpoint and the same Gaussian evaluation policy as
# eval_full_gaussian_from_pyramid233.yaml.
experiment:
  name: ucsf_pdgm_pyramid233_gaussian

runtime:
  seed: 73
  device: auto
  accelerate: false
  find_unused_parameters: true

data:
  type: ucsf_pdgm_volume
  dataset_path: C:/ML/data/UCSF-PDGM
  image_size: 128
  channels: 4
  batch_size: 1
  workers: 0
  size_splits: 155
  subject_limit: 1
  modalities: [flair, t1, t1ce, t2]
  modality_mapping:
    flair: FLAIR
    t1: T1
    t1ce: T1c
    t2: T2
  segmentation_suffix: tumor_segmentation
  reference_modality: flair
  # BraTS_2021 and UCSF-PDGM were inspected with nibabel and both use LPS.
  # The adapter validates this contract and keeps the native array layout.
  model_orientation: LPS
  duplicate_policy: error
  histogram_normalization: false
  return_metadata: true

model:
  type: andi_unet
  image_size: 128
  in_channels: 4
  out_channels: 4
  time_dim: 256
  checkpoint: outputs/checkpoints/pyramid233_lmdb_full_gaussian/epoch_0232.pt
  use_ema: true

diffusion:
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02

noise:
  schedule:
    type: static
    sampler:
      type: gaussian

anomaly:
  t_lower: 75
  t_upper: 200
  aggregation:
    type: geometric_mean
    eps: 1.0e-8
  modality_pool:
    type: max
  median_filter:
    enabled: true
    kernel_size: 5
  threshold: yen

metrics:
  output_csv: outputs/metrics/ucsf_pdgm_pyramid233_gaussian/ANDi.csv
  output_mf_csv: outputs/metrics/ucsf_pdgm_pyramid233_gaussian/ANDi_mf.csv
  thr_start: 0.01
  thr_end: 0.3
  thr_step: 0.001
  threshold: 0.5
  size_splits: 155
  kernel_size: 5
  rank: 3
  connectivity: 1
  median_filter:
    enabled: true
    kernel_size: 5
    mode: 3d
  postprocess:
    score:
      pipeline:
        - type: normalize
    score_mf:
      pipeline:
        - type: median_filter
          kernel_size: 5
          mode: 3d
        - type: normalize
    threshold_mask:
      pipeline:
        - type: binary_dilation
          rank: 3
          connectivity: 1
          iterations: 1
    yen_mask:
      pipeline:
        - type: binary_dilation
          rank: 3
          connectivity: 1
          iterations: 1

prediction_output:
  enabled: true
  directory: outputs/predictions/ucsf_pdgm_pyramid233_gaussian
  normalization_scope: subject
  restore_native_grid: true
  save_raw_score: true
  save_median_filtered_score: true
  binary_mask_source: score_mf
  save_binary_mask: true
  save_threshold_mask: false

evaluation:
  progress:
    enabled: true
